<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open Play Generator — By draiyned</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="gate-overlay">
  <form id="gate-form" novalidate>
    <h1>Sign In</h1>
    <div id="gsi-wrap" style="display:none">
      <div id="gsi-btn"></div>
      <p id="gsi-status"></p>
    </div>
    <input type="email" id="gate-email" placeholder="Enter your email address" autocomplete="email" inputmode="email" autofocus />
    <input type="password" id="gate-input" placeholder="Enter the app password" autocomplete="off" />
    <button type="submit" id="gate-submit">Unlock</button>
    <p id="gate-error">Incorrect password.</p>
    <p id="gate-note">Your email is recorded to manage access to this tool.</p>
  </form>
</div>

<script src="config.js"></script>
<script src="qr.js"></script>
<div id="root" style="display:none"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(function () {
  var GATE_PASSWORD = "october2026";
  var SESSION_KEY = "gate-unlocked";
  var EMAIL_KEY = "gate-email";
  // Set in config.js. While the URL is still the placeholder, the gate skips
  // the server check and only validates locally.
  var CFG = window.OPG_CONFIG || {};
  var ACCESS_URL = CFG.ACCESS_URL || "PASTE_APPS_SCRIPT_URL_HERE";
  // Set in config.js. While the client ID is still the placeholder, the gate
  // falls back to a typed (unverified) email.
  var GOOGLE_CLIENT_ID = CFG.GOOGLE_CLIENT_ID || "PASTE_GOOGLE_CLIENT_ID_HERE";
  var useGoogle = GOOGLE_CLIENT_ID.indexOf("PASTE_") !== 0;
  var googleCredential = "";
  var googleEmail = "";
  var DEVICE_KEY = "opg-device-id";
  var submitBtn = document.getElementById("gate-submit");

  function getDeviceId() {
    try {
      var id = localStorage.getItem(DEVICE_KEY);
      if (!id) {
        id = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : "d-" + Date.now() + "-" + Math.random().toString(36).slice(2, 12);
        localStorage.setItem(DEVICE_KEY, id);
      }
      return id;
    } catch (e) {
      // no storage: use a one-off id so everyone without storage isn't treated as one device
      return "tmp-" + Math.random().toString(36).slice(2, 14);
    }
  }

  // While someone is inside, ask the server every few seconds whether they've
  // been put on hold, and send them back to the sign-in screen if so.
  var POLL_MS = (Number(CFG.POLL_SECONDS) || 15) * 1000;
  var NOTICE_KEY = "gate-notice";
  var pollTimer = null;

  function kickOut(msg) {
    try {
      sessionStorage.removeItem(SESSION_KEY);
      sessionStorage.setItem(NOTICE_KEY, msg);
    } catch (e) {}
    location.reload();
  }

  function pollStatus() {
    if (ACCESS_URL.indexOf("PASTE_") === 0) return;
    var email = "";
    try { email = sessionStorage.getItem(EMAIL_KEY) || ""; } catch (e) {}
    fetch(ACCESS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "status", email: email, device: getDeviceId() })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res && res.allowed === false) kickOut("Your access was put on hold. Contact the developer.");
    }).catch(function () {
      // offline or server hiccup: don't kick anyone out because of that
    });
  }

  function startPolling() {
    if (pollTimer) return;
    pollStatus();
    pollTimer = setInterval(pollStatus, POLL_MS);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) pollStatus();
    });
  }

  function showError(msg) {
    error.textContent = msg;
    error.style.display = "block";
  }

  function checkAccess(email) {
    if (ACCESS_URL.indexOf("PASTE_") === 0) return Promise.resolve({ allowed: true, email: email });
    // text/plain keeps this a "simple" request, so no CORS preflight is needed
    return fetch(ACCESS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        credential: useGoogle ? googleCredential : "",
        email: useGoogle ? "" : email,
        device: getDeviceId(),
        ua: (navigator.userAgent || "").slice(0, 200)
      })
    }).then(function (r) { return r.json(); });
  }

  function emailFromCredential(cred) {
    // display only -- the server verifies the token before trusting it
    try {
      var part = cred.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(atob(part)).email || "";
    } catch (e) {
      return "";
    }
  }

  function onGoogleCredential(resp) {
    googleCredential = resp.credential || "";
    googleEmail = emailFromCredential(googleCredential);
    document.getElementById("gsi-status").textContent = googleEmail ? "Signed in as " + googleEmail : "Signed in with Google";
    error.style.display = "none";
    input.focus();
  }

  function setupGoogle() {
    emailInput.style.display = "none";
    document.getElementById("gsi-wrap").style.display = "";
    var s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.defer = true;
    s.onload = function () {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential });
      google.accounts.id.renderButton(document.getElementById("gsi-btn"), {
        theme: "filled_black", size: "large", text: "signin_with", shape: "pill"
      });
    };
    s.onerror = function () { showError("Couldn't load Google sign-in. Check your connection."); };
    document.head.appendChild(s);
  }

  var overlay = document.getElementById("gate-overlay");
  var form = document.getElementById("gate-form");
  var input = document.getElementById("gate-input");
  var emailInput = document.getElementById("gate-email");
  var error = document.getElementById("gate-error");
  var root = document.getElementById("root");

  function unlock() {
    overlay.style.display = "none";
    root.style.display = "";
    var script = document.createElement("script");
    script.src = "app.js";
    document.body.appendChild(script);
    startPolling();
  }

  var alreadyIn = false;
  try {
    if (sessionStorage.getItem(SESSION_KEY) === "yes") {
      alreadyIn = true;
      unlock();
    }
  } catch (e) {
    // sessionStorage unavailable (e.g. some file:// or privacy modes) -- gate stays up
  }

  try {
    var notice = sessionStorage.getItem(NOTICE_KEY);
    if (notice && !alreadyIn) {
      sessionStorage.removeItem(NOTICE_KEY);
      showError(notice);
    }
  } catch (e) {}

  if (useGoogle && !alreadyIn) setupGoogle();

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = emailInput.value.trim();
    if (useGoogle) {
      if (!googleCredential) {
        showError("Sign in with Google first.");
        return;
      }
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError("Enter a valid email address.");
      emailInput.focus();
      return;
    }
    if (input.value !== GATE_PASSWORD) {
      showError("Incorrect password.");
      input.value = "";
      input.focus();
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = "Checking…";
    checkAccess(email).then(function (res) {
      if (res && res.allowed) {
        error.style.display = "none";
        try {
          sessionStorage.setItem(SESSION_KEY, "yes");
          sessionStorage.setItem(EMAIL_KEY, res.email || email);
        } catch (err) {
          // ignore if storage isn't available
        }
        unlock();
      } else if (res && res.reason === "blocked") {
        showError("Access is on hold for this email or device. Contact the developer.");
      } else if (res && res.reason === "unverified") {
        googleCredential = "";
        document.getElementById("gsi-status").textContent = "";
        showError("Google sign-in couldn't be verified. Sign in with Google again.");
      } else {
        showError("Couldn't verify access. Try again.");
      }
    }).catch(function (err) {
      showError("Couldn't reach the access server (" + String((err && err.message) || err).slice(0, 80) + "). Check your connection and try again.");
    }).then(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = "Unlock";
    });
  });
})();
</script>

</body>
</html>
