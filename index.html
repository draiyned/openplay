<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open Play Generator — By draiyned</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="gate-overlay">
  <form id="gate-form" novalidate>
    <h1>Sign In</h1>
    <input type="email" id="gate-email" placeholder="Email address" autocomplete="email" inputmode="email" autofocus />
    <input type="password" id="gate-input" placeholder="Password" autocomplete="off" />
    <button type="submit" id="gate-submit">Unlock</button>
    <p id="gate-error">Incorrect password.</p>
    <p id="gate-note">Your email is recorded to manage access to this tool.</p>
  </form>
</div>

<div id="root" style="display:none"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(function () {
  var GATE_PASSWORD = "october2026";
  var SESSION_KEY = "gate-unlocked";
  var EMAIL_KEY = "gate-email";
  // Paste your Google Apps Script web-app URL here (see README). While this
  // is left as-is, the gate skips the server check and only validates locally.
  var ACCESS_URL = "PASTE_APPS_SCRIPT_URL_HERE";
  var DEVICE_KEY = "opg-device-id";
  var submitBtn = document.getElementById("gate-submit");

  function getDeviceId() {
    try {
      var id = localStorage.getItem(DEVICE_KEY);
      if (!id) {
        id = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : "d-" + Date.now() + "-" + Math.random().toString(36).slice(2, 12);
        localStorage.setItem(DEVICE_KEY, id);
      }
      return id;
    } catch (e) {
      return "no-storage";
    }
  }

  function showError(msg) {
    error.textContent = msg;
    error.style.display = "block";
  }

  function checkAccess(email) {
    if (ACCESS_URL.indexOf("PASTE_") === 0) return Promise.resolve({ allowed: true });
    var url = ACCESS_URL +
      "?email=" + encodeURIComponent(email) +
      "&device=" + encodeURIComponent(getDeviceId()) +
      "&ua=" + encodeURIComponent((navigator.userAgent || "").slice(0, 200));
    return fetch(url).then(function (r) { return r.json(); });
  }

  var overlay = document.getElementById("gate-overlay");
  var form = document.getElementById("gate-form");
  var input = document.getElementById("gate-input");
  var emailInput = document.getElementById("gate-email");
  var error = document.getElementById("gate-error");
  var root = document.getElementById("root");

  function unlock() {
    overlay.style.display = "none";
    root.style.display = "";
    var script = document.createElement("script");
    script.src = "app.js";
    document.body.appendChild(script);
  }

  try {
    if (sessionStorage.getItem(SESSION_KEY) === "yes") {
      unlock();
    }
  } catch (e) {
    // sessionStorage unavailable (e.g. some file:// or privacy modes) -- gate stays up
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = emailInput.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError("Enter a valid email address.");
      emailInput.focus();
      return;
    }
    if (input.value !== GATE_PASSWORD) {
      showError("Incorrect password.");
      input.value = "";
      input.focus();
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = "Checking…";
    checkAccess(email).then(function (res) {
      if (res && res.allowed) {
        error.style.display = "none";
        try {
          sessionStorage.setItem(SESSION_KEY, "yes");
          sessionStorage.setItem(EMAIL_KEY, email);
        } catch (err) {
          // ignore if storage isn't available
        }
        unlock();
      } else if (res && res.reason === "blocked") {
        showError("Access is on hold for this email or device. Contact the organizer.");
      } else {
        showError("Couldn't verify access. Try again.");
      }
    }).catch(function () {
      showError("Couldn't reach the access server. Check your connection and try again.");
    }).then(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = "Unlock";
    });
  });
})();
</script>

</body>
</html>
